name: videoflow-dev
services:
  videoflow-frontend:
    image: videoflow-quality:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: quality
    entrypoint: []
    command:
      - npm
      - run
      - dev
      - --workspace
      - '@videoflow/web'
      - --
      - --host
      - 0.0.0.0
    read_only: false
    mem_limit: 1g
    cpus: 1
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    volumes:
      - ./apps/web/src:/workspace/apps/web/src
      - ./apps/web/index.html:/workspace/apps/web/index.html
      - ./apps/web/vite.config.ts:/workspace/apps/web/vite.config.ts:ro
      - dev-node-modules:/workspace/node_modules
      - dev-web-modules:/workspace/apps/web/node_modules
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:8080').then(r=>process.exit(r.ok?0:1))
  videoflow-api:
    image: videoflow-quality:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: quality
    command:
      - node
      - infra/scripts/watch-api.mjs
    read_only: false
    volumes:
      - ./apps/api/src:/workspace/apps/api/src
      - dev-api-node-modules:/workspace/node_modules
      - dev-api-modules:/workspace/apps/api/node_modules
  videoflow-proxy:
    volumes:
      - ./infra/nginx/proxy.dev.conf:/etc/nginx/nginx.conf:ro
volumes:
  dev-node-modules: {}
  dev-web-modules: {}
  dev-api-node-modules: {}
  dev-api-modules: {}
