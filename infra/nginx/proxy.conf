worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  log_format safe escape=json '{"status":$status,"method":"$request_method","bytes":$body_bytes_sent,"duration":$request_time}';
  access_log /dev/stdout safe;
  server_tokens off;
  client_body_temp_path /tmp/client;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;
  resolver 127.0.0.11 valid=5s ipv6=off;
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }
  map $status $retry_after { default ''; 429 60; }
  limit_req_zone $binary_remote_addr zone=api:10m rate=5r/s;
  server {
    listen 8080;
    client_max_body_size 16k;
    client_body_timeout 15s;
    send_timeout 300s;
    error_page 413 =413 @body_error;
    error_page 429 =429 @rate_error;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Retry-After $retry_after always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    location = /health { access_log off; return 200 'ok'; }
    location /api {
      limit_req zone=api burst=30 nodelay;
      limit_req_status 429;
      set $api http://videoflow-api:3000;
      proxy_pass $api;
      proxy_http_version 1.1;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_set_header Forwarded '';
      proxy_set_header Connection '';
      proxy_hide_header Retry-After;
      proxy_buffering off;
      proxy_request_buffering on;
      proxy_read_timeout 300s;
      proxy_send_timeout 300s;
      proxy_connect_timeout 5s;
      proxy_next_upstream off;
      error_page 502 503 504 =503 @gateway_error;
    }
    location @gateway_error {
      default_type application/json;
      return 503 '{"error":{"code":"GATEWAY_UNAVAILABLE","message":"Serviço temporariamente indisponível. Tente novamente.","requestId":"proxy"}}';
    }
    location @body_error {
      default_type application/json;
      return 413 '{"error":{"code":"BODY_TOO_LARGE","message":"Corpo excede o limite permitido.","requestId":"proxy"}}';
    }
    location @rate_error {
      default_type application/json;
      return 429 '{"error":{"code":"RATE_LIMITED","message":"Limite de requisições atingido. Aguarde e tente novamente.","requestId":"proxy"}}';
    }
    location / {
      set $frontend http://videoflow-frontend:8080;
      proxy_pass $frontend;
      proxy_set_header Host $http_host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
    }
  }
}
