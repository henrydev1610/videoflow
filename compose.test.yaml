name: videoflow-acceptance
services:
  videoflow-api:
    environment:
      ORIGIN: http://localhost:8081
  videoflow-proxy:
    ports: !override
      - 127.0.0.1:8081:8080
  fixture:
    image: videoflow-quality:local
    init: true
    user: node
    networks:
      - outbound
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    command:
      - node
      - --import
      - tsx
      - tests/fixtures/media-server.ts
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1/video.mp4',{method:'HEAD'}).then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 3s
      timeout: 3s
      retries: 20
    pull_policy: never
  videoflow-egress:
    image: videoflow-quality:local
    command:
      - node
      - --import
      - tsx
      - tests/fixtures/gateway-test.ts
    depends_on:
      fixture:
        condition: service_healthy
    pull_policy: never
  quality:
    image: videoflow-quality:local
    init: true
    user: node
    networks:
      - data
      - outbound
      - app
    environment:
      DATABASE_URL: postgresql://videoflow:videoflow-local-only@videoflow-postgres:5432/videoflow
      REDIS_URL: redis://videoflow-redis:6379
      ORIGIN: http://videoflow-proxy:8080
      ARTIFACT_ROOT: /media/artifacts
      XDG_DATA_HOME: /tmp
    volumes:
      - artifacts:/media/artifacts
      - temporary:/media/temp
      - commands:/spool/commands
      - results:/spool/results
      - ./docs/verification/docker:/workspace/docs/verification/docker
      - ./tests:/workspace/tests:ro
      - ./infra/scripts:/workspace/infra/scripts:ro
      - ./apps/web/e2e:/workspace/apps/web/e2e:ro
    depends_on: &a1
      videoflow-worker:
        condition: service_healthy
    profiles: &a2
      - tools
    command:
      - sh
      - infra/scripts/quality.sh
    pull_policy: never
  e2e:
    image: videoflow-e2e:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: e2e
    init: true
    user: node
    networks:
      - app
      - data
      - entry
    environment:
      DATABASE_URL: postgresql://videoflow:videoflow-local-only@videoflow-postgres:5432/videoflow
      REDIS_URL: redis://videoflow-redis:6379
      ORIGIN: http://videoflow-proxy:8080
      ARTIFACT_ROOT: /media/artifacts
      XDG_DATA_HOME: /tmp
      E2E_DATABASE_URL: postgresql://videoflow:videoflow-local-only@videoflow-postgres:5432/videoflow
      E2E_BASE_URL: http://videoflow-proxy:8080
      RUN_WEB_REAL: '1'
    volumes:
      - ./docs/verification/docker/playwright:/workspace/docs/verification/dashboard-playwright
      - ./docs/verification/docker/e2e-evidence:/workspace/docs/verification/dashboard-evidence
      - ./apps/web/e2e:/workspace/apps/web/e2e:ro
    depends_on:
      videoflow-worker:
        condition: service_healthy
      videoflow-proxy:
        condition: service_healthy
    profiles: *a2
    command:
      - npx
      - playwright
      - test
      - --config
      - apps/web/playwright.config.ts
    shm_size: 512m
