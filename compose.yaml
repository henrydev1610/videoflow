name: videoflow
services:
  videoflow-postgres:
    init: true
    read_only: true
    cap_drop: &a1
      - ALL
    security_opt: &a2
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/run/postgresql:size=16m,mode=1777
    pids_limit: 128
    restart: unless-stopped
    logging: &a3
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    image: postgres:17.6-bookworm@sha256:f3bd19c606e442c3d7bdfa8002e03fe260a1023351e0ea4598032022b68dd6e3
    user: postgres
    mem_limit: 512m
    cpus: 1
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-videoflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-videoflow-local-only}
      POSTGRES_DB: ${POSTGRES_DB:-videoflow}
    volumes:
      - pg-data:/var/lib/postgresql/data
    networks:
      data:
        aliases:
          - postgres
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 3s
      timeout: 3s
      retries: 30
  videoflow-redis:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: &a4
      - /tmp:size=128m,mode=1777
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: redis:7.4.6-bookworm@sha256:a9cc41d6d01da2aa26c219e4f99ecbeead955a7b656c1c499cce8922311b2514
    user: redis
    mem_limit: 256m
    cpus: 0.5
    command:
      - redis-server
      - --appendonly
      - yes
      - --appendfsync
      - everysec
      - --maxmemory
      - 192mb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    networks:
      data:
        aliases:
          - redis
    healthcheck:
      test:
        - CMD
        - redis-cli
        - ping
      interval: 3s
      timeout: 3s
      retries: 30
  videoflow-initialize:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: no
    logging: *a3
    image: videoflow-media:local
    mem_limit: 128m
    cpus: 0.25
    user: root
    network_mode: none
    volumes:
      - commands:/spool/commands
      - results:/spool/results
      - temporary:/media/temp
      - artifacts:/media/artifacts
    command:
      - chown
      - 1000:1000
      - /spool/commands
      - /spool/results
      - /media/temp
      - /media/artifacts
    cap_add:
      - CHOWN
    pull_policy: never
  videoflow-migrate:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: no
    logging: *a3
    image: videoflow-quality:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: quality
    mem_limit: 512m
    cpus: 1
    environment: &a5
      DATABASE_URL: postgresql://${POSTGRES_USER:-videoflow}:${POSTGRES_PASSWORD:-videoflow-local-only}@videoflow-postgres:5432/${POSTGRES_DB:-videoflow}
      REDIS_URL: redis://videoflow-redis:6379
    networks:
      - data
    depends_on:
      videoflow-postgres:
        condition: service_healthy
    command:
      - npm
      - run
      - db:migrate
  videoflow-egress:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-media:local
    mem_limit: 256m
    cpus: 0.5
    environment:
      MEDIA_HOST_ALLOWLIST: ${SOURCE_ALLOWLIST:-}
    command:
      - node
      - workers/media-worker/dist/gateway-main.js
    networks:
      media:
        aliases:
          - egress
      outbound: {}
    healthcheck:
      test:
        - CMD
        - node
        - infra/health/check.mjs
        - gateway
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    pull_policy: never
  videoflow-media-sandbox:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-media:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: media
    mem_limit: 2g
    cpus: 2
    command:
      - node
      - workers/media-worker/dist/sandbox.js
    networks:
      - media
    volumes:
      - commands:/spool/commands:ro
      - results:/spool/results
      - temporary:/media/temp
    depends_on:
      videoflow-initialize:
        condition: service_completed_successfully
      videoflow-egress:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - infra/health/check.mjs
        - sandbox
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 15s
  videoflow-worker:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-media:local
    mem_limit: 512m
    cpus: 1
    environment: *a5
    networks:
      - data
    volumes:
      - commands:/spool/commands
      - results:/spool/results
      - temporary:/media/temp
      - artifacts:/media/artifacts
    depends_on:
      videoflow-migrate:
        condition: service_completed_successfully
      videoflow-redis:
        condition: service_healthy
      videoflow-media-sandbox:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - infra/health/check.mjs
        - worker
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
    stop_grace_period: 45s
    pull_policy: never
  videoflow-api:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-api:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: api
    mem_limit: 512m
    cpus: 1
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-videoflow}:${POSTGRES_PASSWORD:-videoflow-local-only}@videoflow-postgres:5432/${POSTGRES_DB:-videoflow}
      REDIS_URL: redis://videoflow-redis:6379
      ORIGIN: ${ORIGIN:-http://localhost:8080}
      ARTIFACT_ROOT: /media/artifacts
      TRUSTED_PROXY_HOST: videoflow-proxy
      SOURCE_ALLOWLIST: ${SOURCE_ALLOWLIST:-}
    networks:
      data:
        aliases:
          - api
      app: {}
    volumes:
      - artifacts:/media/artifacts:ro
    depends_on:
      videoflow-migrate:
        condition: service_completed_successfully
      videoflow-redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - infra/health/check.mjs
        - api
      interval: 5s
      timeout: 5s
      retries: 6
      start_period: 15s
  videoflow-frontend:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-frontend:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: frontend
    mem_limit: 128m
    cpus: 0.5
    networks:
      - frontend
    healthcheck:
      test:
        - CMD
        - curl
        - -fsS
        - http://127.0.0.1:8080/health
      interval: 5s
      timeout: 3s
      retries: 6
  videoflow-proxy:
    init: true
    read_only: true
    cap_drop: *a1
    security_opt: *a2
    tmpfs: *a4
    pids_limit: 128
    restart: unless-stopped
    logging: *a3
    image: videoflow-proxy:local
    build:
      context: .
      dockerfile: infra/docker/runtime.Dockerfile
      target: proxy
    mem_limit: 128m
    cpus: 0.5
    ports:
      - 127.0.0.1:${HTTP_PORT:-8080}:8080
    networks:
      - entry
      - frontend
      - app
    depends_on:
      videoflow-api:
        condition: service_started
      videoflow-frontend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - curl -fsS http://127.0.0.1:8080/health && curl -fsS
          http://127.0.0.1:8080/api/health && curl -fsS http://127.0.0.1:8080/
          >/dev/null
      interval: 5s
      timeout: 5s
      retries: 6
networks:
  entry: {}
  frontend:
    internal: true
  app:
    internal: true
  data:
    internal: true
  media:
    internal: true
    driver_opts:
      com.docker.network.bridge.gateway_mode_ipv4: isolated
  outbound: {}
volumes:
  pg-data: {}
  redis-data: {}
  commands: {}
  results: {}
  temporary: {}
  artifacts: {}
